name: Verify PVZ CONTROL
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check sync.js
      - run: node tests/core.cjs
      - run: node tests/sync.cjs
      - run: node tests/flows.cjs
      - run: node tests/ios.cjs
